<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" role="img" aria-labelledby="title desc">
<title id="title">Proposta de atendimento em cinco etapas com revisão</title><desc id="desc">Revisão completa de campos e filhos aceitos do atendimento, edição por etapa, confirmação única e continuação com salvamentos separados.</desc>
<style>text{font-family:Arial,sans-serif;fill:#1f2937;font-size:17px} .small{font-size:14px;fill:#475569} .heading{font-size:25px;font-weight:700} .label{font-size:16px;font-weight:700} .white{fill:white} .blue{fill:#174d92} .muted{fill:#64748b}</style>
<rect width="1280" height="940" fill="#f3f6fa"/>
<rect width="1280" height="62" fill="#163b69"/>
<text x="26" y="39" class="white label">AMBULATÓRIO • SANTA CASA</text>
<rect x="891" y="14" width="363" height="34" rx="6" fill="#dce9ff"/>
<text x="909" y="37" class="blue label">PROPOSTA • wireframe documental</text>
<text x="28" y="102" class="small">Pacientes / Pessoa sintética 001 / Novo atendimento</text><text x="28" y="144" class="heading">Revisar antes de confirmar</text><text x="28" y="174" class="">Pessoa sintética 001 • ID 1 • consulta em 05/10/2026 • rascunho em memória</text><rect x="25" y="193" width="1230" height="84" rx="8" fill="#fff" stroke="#d6dfeb"/><text x="45" y="230" class="small">1 Atendimento</text><text x="287" y="230" class="small">2 Avaliação e Chagas</text><text x="529" y="230" class="small">3 Exames e familiares</text><text x="771" y="230" class="small">4 Pendências</text><text x="1013" y="230" class="blue label">5 Revisão</text><text x="47" y="259" class="small">Voltar a uma etapa conserva os valores. Só a confirmação abaixo registra o atendimento.</text><rect x="25" y="294" width="779" height="400" rx="8" fill="#fff" stroke="#d6dfeb"/><text x="49" y="330" class="label">Resumo do que será registrado</text><text x="50" y="366" class="label">Atendimento</text><text x="50" y="389" class="small">Data e observação geral, localização de prontuário</text><text x="736" y="366" class="blue small">Editar</text><text x="50" y="417" class="label">Avaliação e Chagas</text><text x="50" y="440" class="small">Peso, PA e demais medidas preenchidas; diagnóstico informado</text><text x="736" y="417" class="blue small">Editar</text><text x="50" y="468" class="label">Exames</text><text x="50" y="491" class="small">1 trazido identificado; 1 solicitado sem resultado</text><text x="736" y="468" class="blue small">Editar</text><text x="50" y="519" class="label">Familiares</text><text x="50" y="542" class="small">Estado desconhecido; nenhum resultado inventado</text><text x="736" y="519" class="blue small">Editar</text><text x="50" y="570" class="label">Pendências</text><text x="50" y="593" class="small">1 descrição; estado desconhecido; sem data de resolução</text><text x="736" y="570" class="blue small">Editar</text><text x="50" y="621" class="label">Ausências relevantes</text><text x="50" y="644" class="small">Campos não informados permanecem como tais</text><text x="736" y="621" class="blue small">Editar</text><rect x="826" y="294" width="429" height="400" rx="8" fill="#eef4fe" stroke="#d6dfeb"/><text x="847" y="332" class="label">Depois de confirmar</text><text x="847" y="376" class="">1. Conferir a confirmação e o detalhe</text><text x="847" y="419" class="">2. Continuar acompanhamento</text><text x="847" y="462" class="">3. Confirmar cada registro posterior</text><text x="847" y="530" class="small">BZN, retorno, projeto, notificação e</text><text x="847" y="559" class="small">encaminhamento têm confirmação própria.</text><text x="847" y="588" class="small">Falha posterior preserva o atendimento</text><text x="847" y="617" class="small">que já foi confirmado.</text><rect x="25" y="713" width="1230" height="163" rx="8" fill="#fff" stroke="#d6dfeb"/><text x="48" y="749" class="label">Ações da revisão</text><rect x="49" y="773" width="205" height="42" rx="8" fill="#fff" stroke="#d6dfeb"/><text x="62" y="800" class="label">Voltar e editar</text><rect x="270" y="773" width="224" height="42" rx="8" fill="#fff" stroke="#d6dfeb"/><text x="283" y="800" class="label">Sair / tratar rascunho</text><rect x="918" y="773" width="312" height="42" rx="8" fill="#174d92" stroke="#d6dfeb"/><text x="931" y="800" class="white label">Confirmar atendimento</text><text x="49" y="850" class="small">Se o resultado não puder ser confirmado, verificar a operação antes de tentar registrar novamente.</text>
<text x="28" y="916" class="small">Dados e pessoas sintéticos. Não é tela implementada. Layout ilustrativo da VU1 proposta; 05/10/2026.</text>
</svg>