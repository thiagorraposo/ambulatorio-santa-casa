<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" role="img" aria-labelledby="title desc">
<title id="title">Proposta de confirmação preservada e verificação de resultado</title><desc id="desc">Atendimento confirmado separado de retorno incerto; rascunho conservado e verificação somente de leitura; saídas para confirmação, não aplicação comprovada e estados ainda desconhecidos.</desc>
<style>text{font-family:Arial,sans-serif;fill:#1f2937;font-size:17px} .small{font-size:14px;fill:#475569} .heading{font-size:25px;font-weight:700} .label{font-size:16px;font-weight:700} .white{fill:white} .blue{fill:#174d92} .muted{fill:#64748b}</style>
<rect width="1280" height="940" fill="#f3f6fa"/>
<rect width="1280" height="62" fill="#163b69"/>
<text x="26" y="39" class="white label">AMBULATÓRIO • SANTA CASA</text>
<rect x="891" y="14" width="363" height="34" rx="6" fill="#dce9ff"/>
<text x="909" y="37" class="blue label">PROPOSTA • wireframe documental</text>
<text x="29" y="104" class="small">Pessoa sintética 001 / Atendimento 101 / Registrar retorno BZN</text><text x="29" y="146" class="heading">Confirmações e recuperação</text><rect x="27" y="170" width="1226" height="116" rx="8" fill="#edf8f0" stroke="#bbddc6"/><text x="49" y="207" class="label">Atendimento confirmado</text><text x="49" y="242" class="">05/10/2026 • Atendimento 101 • Seus dados já estão registrados.</text><text x="49" y="272" class="small">Esta confirmação permanece ao recuperar a operação abaixo.</text><rect x="27" y="305" width="600" height="418" rx="8" fill="#fff" stroke="#d6dfeb"/><text x="49" y="342" class="label">Retorno BZN — resultado ainda desconhecido</text><text x="49" y="375" class="">O envio foi interrompido antes da confirmação.</text><text x="49" y="405" class="">O registro pode ter sido salvo. Verifique o resultado.</text><text x="51" y="448" class="small">Data de comparecimento</text><rect x="51" y="458" width="548" height="42" rx="8" fill="#fff" stroke="#d6dfeb"/><text x="63" y="485" class="">05/10/2026</text><text x="51" y="535" class="small">Resumo preservado</text><rect x="51" y="545" width="548" height="42" rx="8" fill="#fff" stroke="#d6dfeb"/><text x="63" y="572" class="">Retorno sintético para documentação</text><rect x="51" y="616" width="248" height="42" rx="8" fill="#174d92" stroke="#d6dfeb"/><text x="64" y="643" class="white label">Verificar resultado</text><rect x="315" y="616" width="285" height="42" rx="8" fill="#fff" stroke="#d6dfeb"/><text x="328" y="643" class="label">Abrir dados em leitura</text><text x="51" y="691" class="small">Confirmar novamente permanece indisponível.</text><rect x="648" y="305" width="605" height="418" rx="8" fill="#eef4fe" stroke="#d6dfeb"/><text x="670" y="342" class="label">O que acontece após verificar</text><text x="671" y="388" class="label">Confirmado</text><text x="671" y="416" class="small">Mostrar confirmação e abrir o registro correto.</text><text x="671" y="465" class="label">Não aplicado, com prova</text><text x="671" y="493" class="small">Revisar e decidir uma nova confirmação.</text><text x="671" y="542" class="label">Em processamento</text><text x="671" y="570" class="small">Aguardar; consultar novamente por leitura.</text><text x="671" y="619" class="label">Não determinável / acesso recusado</text><text x="671" y="647" class="small">Manter bloqueio e oferecer orientação de suporte.</text><rect x="27" y="742" width="1226" height="137" rx="8" fill="#fff" stroke="#d6dfeb"/><text x="49" y="779" class="label">Outras situações de recuperação</text><text x="49" y="815" class="">403 recebido: verificar acesso, conservar rascunho e solicitar nova confirmação consciente.</text><text x="49" y="846" class="small">409: comparar dados atuais e rascunho; não substituir automaticamente. Recibos anteriores permanecem.</text>
<text x="28" y="916" class="small">Dados e pessoas sintéticos. Não é tela implementada. Layout ilustrativo da VU1 proposta; 05/10/2026.</text>
</svg>